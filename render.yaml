services:
  # Backend Service (Python FastAPI)
  - type: web
    name: cybersaheli-backend
    env: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: cybersaheli-db
          property: connectionString

databases:
  # Managed PostgreSQL Database
  - name: cybersaheli-db
    databaseName: cybersaheli
    user: cybersaheli_user
    region: singapore
