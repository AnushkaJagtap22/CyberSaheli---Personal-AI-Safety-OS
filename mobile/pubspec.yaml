name: cybersaheli
description: "CyberSaheli v2.0 - Premium AI Digital Bodyguard for Women."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Routing
  flutter_riverpod: ^2.4.9
  go_router: ^12.1.1
  flutter_hooks: ^0.20.4
  hooks_riverpod: ^2.4.9

  # UI / Design
  google_fonts: ^6.1.0
  lottie: ^3.0.0
  glassmorphism_ui: ^0.2.0
  flutter_svg: ^2.0.9

  # Data & Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  dio: ^5.4.0

  # AI / On-Device Processing
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.10.0
  tflite_flutter: ^0.10.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  freezed: ^2.4.5
  json_serializable: ^8.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
