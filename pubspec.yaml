name: cybersaheli
description: CyberSaheli - AI-Powered Women's Safety Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # UI Components
  cupertino_icons: ^1.0.6
  lottie: ^3.0.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Material 3
  flutter_animate: ^4.3.0

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Camera & Media
  camera: ^0.10.5+7
  image_picker: ^1.0.7
  permission_handler: ^11.2.0

  # Notifications
  flutter_local_notifications: ^16.3.2

  # Biometrics
  local_auth: ^2.1.8

  # Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Network
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # AI/ML
  google_ml_kit: ^0.16.0
  tflite_flutter: ^0.10.4

  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.2.3
  share_plus: ^7.2.1
  path_provider: ^2.1.2
  file_picker: ^6.1.1
  open_file: ^3.3.2

  # QR Code
  qr_code_scanner: ^1.0.1
  qr_flutter: ^4.1.0

  # Charts
  fl_chart: ^0.66.0

  # Animation
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  riverpod_lint: ^2.3.7
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
